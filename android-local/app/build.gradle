plugins {
    id 'com.android.application'
}

android {
    namespace 'ch.pokemoncardfinder.local'
    compileSdk 35

    defaultConfig {
        applicationId 'ch.pokemoncardfinder.local'
        minSdk 24
        targetSdk 35
        // GitHub Actions passes a monotonically increasing build number for each published APK.
        versionCode = Integer.parseInt(project.findProperty('pcfVersionCode')?.toString() ?: '12000')
        versionName = project.findProperty('pcfVersionName')?.toString() ?: '1.2.0'
    }

    def stableKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
    signingConfigs {
        stable {
            if (stableKeystorePath) {
                storeFile file(stableKeystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'pcf-update'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (stableKeystorePath) signingConfig signingConfigs.stable
        }
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
}
