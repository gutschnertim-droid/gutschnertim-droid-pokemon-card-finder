name: Migros Filialbestände erfassen
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-migros-stock.yml'
      - 'data/branches.json'
      - 'data/migros_pokemon_catalog_fribourg_20261011.json'
      - 'scripts/collect_migros_stock.py'
      - 'requirements-collector.txt'
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: migros-stock-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-collector.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/collect_migros_stock.py
      - name: Erfassungsstand in der Job-Zusammenfassung zeigen
        run: |
          python - <<'PY'
          import json
          import os

          with open("data/stock-latest.json", encoding="utf-8") as file:
              feed = json.load(file)

          regions = feed.get("regions", {})
          pairs = sum(
              len(product.get("branches", {}))
              for region in regions.values()
              for product in region.get("products", {}).values()
          )
          expected = feed.get("total_branches", 0) * feed.get("total_products", 0)
          if not expected or feed.get("checked_pairs") != expected or pairs != expected:
              raise SystemExit(
                  f"Feed-Abdeckung unvollständig: {pairs}/{expected} Datensätze, "
                  f"Zähler={feed.get('checked_pairs')}"
              )

          lines = [
              "## Migros-Bestandsabfrage",
              f"- Stand: {feed.get('checked_at_local_approx', 'unbekannt')}",
              f"- Abdeckung: {pairs}/{expected} Produkt-Filial-Kombinationen",
              "",
              "| Gebiet | Filialen | Artikel | Kombinationen |",
              "| --- | ---: | ---: | ---: |",
          ]
          for name, region in regions.items():
              branch_count = len(region.get("branches", []))
              product_count = len(region.get("products", {}))
              lines.append(
                  f"| {name} | {branch_count} | {product_count} "
                  f"| {branch_count * product_count} |"
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
              file.write("\n".join(lines) + "\n")
          print(f"Feed vollständig: {pairs}/{expected} Kombinationen.")
          PY
      - name: Feed speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aktualisiere Migros-Filialbestände"
          git push
