name: Migros Filialbestände erfassen
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-migros-stock.yml'
      - 'data/branches.json'
      - 'data/migros_pokemon_catalog_fribourg_20261011.json'
      - 'scripts/collect_migros_stock.py'
      - 'requirements-collector.txt'
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: migros-stock-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-collector.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/collect_migros_stock.py
      - name: Feed speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aktualisiere Migros-Filialbestände"
          git push
