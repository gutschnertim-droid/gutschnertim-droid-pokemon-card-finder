name: Build local Android live test
on:
  push:
    branches: [main]
    paths:
      - 'android-local/**'
      - '.github/workflows/build-android-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-local
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-card-finder-android-test
          path: android-local/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=android-test-latest
          apk_path=android-local/app/build/outputs/apk/debug/app-debug.apk
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" "$apk_path" \
              --target "$GITHUB_SHA" \
              --title "Pokémon Card Finder – Android Test" \
              --notes "Automatisch gebaute Android-Testversion. Der Direktlink wird bei jedem erfolgreichen Build aktualisiert." \
              --prerelease
          else
            gh release upload "$release_tag" "$apk_path" --clobber
          fi
