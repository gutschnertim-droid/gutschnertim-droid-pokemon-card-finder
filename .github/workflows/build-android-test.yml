name: Build local Android live test
on:
  push:
    branches: [main]
    paths:
      - 'android-local/**'
      - '.github/workflows/build-android-test.yml'
  workflow_dispatch:
concurrency:
  group: android-test-apk
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate unique Migros product IDs
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          catalog = json.loads(Path("android-local/app/src/main/assets/catalog.json").read_text(encoding="utf-8"))
          items = catalog["products"]
          ids = [str(item["id"]).strip() for item in items]
          assert all(re.fullmatch(r"\d{12}", item_id) for item_id in ids), "Invalid Migros product ID"
          assert len(ids) == len(set(ids)), "Duplicate Migros product IDs in catalog"
          assert all(item.get("product_url") == "https://www.migros.ch/de/product/" + item_id
                     for item, item_id in zip(items, ids)), "Product link/ID mismatch"
          assert catalog["store_catalog_count"] == len(items), "Catalog count mismatch"
          print(f"Validated {len(ids)} distinct Migros product IDs")
          PY
      - name: Assign increasing version number
        run: |
          echo "APP_VERSION=1.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((12000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Prepare stable signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pokemon-card-finder.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pokemon-card-finder.p12" >> "$GITHUB_ENV"
          fi
      - name: Build installable APK
        working-directory: android-local
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            gradle --no-daemon :app:assembleRelease -PpcfVersionName="$APP_VERSION" -PpcfVersionCode="$APP_VERSION_CODE"
            mkdir -p app/build/outputs/apk/download
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/download/app-debug.apk
          else
            gradle --no-daemon :app:assembleDebug -PpcfVersionName="$APP_VERSION" -PpcfVersionCode="$APP_VERSION_CODE"
            mkdir -p app/build/outputs/apk/download
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/download/app-debug.apk
            echo "::warning::Stable signing is not configured. This APK may require reinstalling."
          fi
      - name: Package APK for phone download
        run: |
          zip -j android-local/app/build/outputs/apk/download/app-debug.zip android-local/app/build/outputs/apk/download/app-debug.apk
          cp android-local/app/build/outputs/apk/download/app-debug.apk "android-local/app/build/outputs/apk/download/pokemon-card-finder-v${APP_VERSION}.apk"
          cp android-local/app/build/outputs/apk/download/app-debug.zip "android-local/app/build/outputs/apk/download/pokemon-card-finder-v${APP_VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-card-finder-android-test
          path: |
            android-local/app/build/outputs/apk/download/app-debug.apk
            android-local/app/build/outputs/apk/download/app-debug.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=android-test-latest
          apk_path=android-local/app/build/outputs/apk/download/app-debug.apk
          zip_path=android-local/app/build/outputs/apk/download/app-debug.zip
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" "$apk_path" "$zip_path" \
              --target "$GITHUB_SHA" \
              --title "Pokémon Card Finder – neueste v${APP_VERSION}" \
              --notes "Neueste Testversion: v${APP_VERSION}. Jede neue APK hat eine höhere Versionsnummer." \
              --prerelease
          else
            gh release upload "$release_tag" "$apk_path" "$zip_path" --clobber
            gh release edit "$release_tag" \
              --title "Pokémon Card Finder – neueste v${APP_VERSION}" \
              --notes "Neueste Testversion: v${APP_VERSION}. Jede neue APK hat eine höhere Versionsnummer."
          fi
          version_tag="v${APP_VERSION}"
          apk_versioned="android-local/app/build/outputs/apk/download/pokemon-card-finder-v${APP_VERSION}.apk"
          zip_versioned="android-local/app/build/outputs/apk/download/pokemon-card-finder-v${APP_VERSION}.zip"
          if gh release view "$version_tag" >/dev/null 2>&1; then
            gh release upload "$version_tag" "$apk_versioned" "$zip_versioned" --clobber
          else
            gh release create "$version_tag" "$apk_versioned" "$zip_versioned" \
              --target "$GITHUB_SHA" \
              --title "Pokémon Card Finder v${APP_VERSION}" \
              --notes "Nummerierter Android-Testbuild v${APP_VERSION}. Die Filialauswahl befindet sich oberhalb der Pokémon-Produkte." \
              --prerelease
          fi
