name: Build local Android live test
on:
  push:
    branches: [main]
    paths:
      - 'android-local/**'
      - '.github/workflows/build-android-test.yml'
  workflow_dispatch:
concurrency:
  group: android-test-apk
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate unique Migros product IDs
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          catalog = json.loads(Path("android-local/app/src/main/assets/catalog.json").read_text(encoding="utf-8"))
          items = catalog["products"]
          ids = [str(item["id"]).strip() for item in items]
          assert all(re.fullmatch(r"\d{12}", item_id) for item_id in ids), "Invalid Migros product ID"
          assert len(ids) == len(set(ids)), "Duplicate Migros product IDs in catalog"
          assert all(item.get("product_url") == "https://www.migros.ch/de/product/" + item_id
                     for item, item_id in zip(items, ids)), "Product link/ID mismatch"
          assert catalog["store_catalog_count"] == len(items), "Catalog count mismatch"
          print(f"Validated {len(ids)} distinct Migros product IDs")
          PY
      - name: Assign increasing version number
        run: |
          echo "APP_VERSION=1.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((12000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Verify Android Java compilation (independent of signing)
        working-directory: android-local
        run: gradle --no-daemon :app:compileDebugJavaWithJavac -PpcfVersionName="$APP_VERSION" -PpcfVersionCode="$APP_VERSION_CODE"
      - name: Prepare stable signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::Stable signing secrets are missing. Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD in Settings > Secrets and variables > Actions. No APK will be published."
            exit 1
          fi
          keystore="$RUNNER_TEMP/pokemon-card-finder.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          expected="48:29:26:07:1D:A9:D7:A1:A0:73:64:E2:1E:52:F5:F6:30:51:51:67:98:80:E0:67:E4:63:6B:DA:28:E4:AC:C4"
          actual="$(keytool -list -v -alias pcf-update -storetype PKCS12 -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD | awk -F 'SHA256: ' '/SHA256:/ { print $2; exit }')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Signing certificate mismatch. Do not rotate the app's signing key accidentally."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "Verified persistent signing certificate: $actual"
      - name: Build signed release APK
        working-directory: android-local
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ANDROID_KEYSTORE_PATH"
          gradle --no-daemon :app:assembleRelease -PpcfVersionName="$APP_VERSION" -PpcfVersionCode="$APP_VERSION_CODE"
          mkdir -p app/build/outputs/apk/download
          # Keep the existing stable download URL even though this is a signed release build.
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/download/app-debug.apk
      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then echo "::error::apksigner not found"; exit 1; fi
          apk="android-local/app/build/outputs/apk/download/app-debug.apk"
          signer_output="$("$apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$signer_output" | grep -i 'sha' || true
          digest="$(printf '%s\n' "$signer_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "Observed APK signer SHA-256: ${digest:-not-found}"
          expected="482926071da9d7a1a07364e21e52f5f6305151679880e067e4636bda28e4acc4"
          if [[ "$digest" != "$expected" ]]; then
            echo "::error::APK is signed with an unexpected certificate. Refusing to publish."
            exit 1
          fi
          echo "APK signing verified: SHA-256 $digest"
      - name: Package APK for phone download
        run: |
          zip -j android-local/app/build/outputs/apk/download/app-debug.zip android-local/app/build/outputs/apk/download/app-debug.apk
          cp android-local/app/build/outputs/apk/download/app-debug.apk "android-local/app/build/outputs/apk/download/pokemon-card-finder-v${APP_VERSION}.apk"
          cp android-local/app/build/outputs/apk/download/app-debug.zip "android-local/app/build/outputs/apk/download/pokemon-card-finder-v${APP_VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-card-finder-android-test
          path: |
            android-local/app/build/outputs/apk/download/app-debug.apk
            android-local/app/build/outputs/apk/download/app-debug.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=android-test-latest
          apk_path=android-local/app/build/outputs/apk/download/app-debug.apk
          zip_path=android-local/app/build/outputs/apk/download/app-debug.zip
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" "$apk_path" "$zip_path" \
              --target "$GITHUB_SHA" \
              --title "Pokémon Card Finder – neueste v${APP_VERSION}" \
              --notes "Neueste Testversion: v${APP_VERSION}. Jede neue APK hat eine höhere Versionsnummer." \
              --prerelease
          else
            gh release upload "$release_tag" "$apk_path" "$zip_path" --clobber
            gh release edit "$release_tag" \
              --title "Pokémon Card Finder – neueste v${APP_VERSION}" \
              --notes "Neueste Testversion: v${APP_VERSION}. Jede neue APK hat eine höhere Versionsnummer."
          fi
          version_tag="v${APP_VERSION}"
          apk_versioned="android-local/app/build/outputs/apk/download/pokemon-card-finder-v${APP_VERSION}.apk"
          zip_versioned="android-local/app/build/outputs/apk/download/pokemon-card-finder-v${APP_VERSION}.zip"
          if gh release view "$version_tag" >/dev/null 2>&1; then
            gh release upload "$version_tag" "$apk_versioned" "$zip_versioned" --clobber
          else
            gh release create "$version_tag" "$apk_versioned" "$zip_versioned" \
              --target "$GITHUB_SHA" \
              --title "Pokémon Card Finder v${APP_VERSION}" \
              --notes "Nummerierter Android-Testbuild v${APP_VERSION}. Die Filialauswahl befindet sich oberhalb der Pokémon-Produkte." \
              --prerelease
          fi
